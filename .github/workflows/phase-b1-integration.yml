name: MediMind B1 isolated preview regression
on:
  pull_request:
    paths:
      - 'app/**'
      - 'preview/**'
      - 'tests/**'
      - '.github/workflows/phase-b1-integration.yml'
  push:
    branches: ['phase2/phase-a-audit-and-local-core']
    paths:
      - 'app/**'
      - 'preview/**'
      - 'tests/**'
      - '.github/workflows/phase-b1-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b1-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MEDIMIND_URL: http://127.0.0.1:3000
      AXE_CORE_JS: ${{ github.workspace }}/vendor/axe.min.js
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        working-directory: preview
        run: npm test
      - name: Install browser and tools
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          mkdir -p vendor artifacts
          npm pack axe-core@4.10.3 --pack-destination vendor --registry=https://registry.npmjs.org/
          tar -xzf vendor/axe-core-4.10.3.tgz -C vendor package/axe.min.js
          mv vendor/package/axe.min.js vendor/axe.min.js
      - name: Start isolated preview and verify browser
        run: |
          bun run app/index.b1.tsx > artifacts/preview-server.log 2>&1 &
          echo $! > artifacts/preview-server.pid
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              print('Preview Chromium launched:',browser.version)
              browser.close()
          PY
      - name: Preserve 17 tests plus B1 scenarios
        run: |
          python -m compileall -q tests conftest.py
          python -m pytest --collect-only -q tests | tee artifacts/collection.txt
      - name: Full browser tests on local preview
        run: |
          python -m pytest tests -v --tb=short --timeout=45 \
            --html=artifacts/report.html --self-contained-html \
            --junitxml=artifacts/junit.xml
      - name: Upload preview browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medimind-b1-preview-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
